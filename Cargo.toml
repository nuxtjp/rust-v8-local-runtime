[workspace]
members = ["."]
resolver = "3"

[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "nuxtjp-local-runtime-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fail-closed loopback host and Rust/V8 adapter boundary for Nuxt"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
base64 = "0.22.1"
rand = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tiny_http = "0.12.0"
url = "2.5.7"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.187"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "thin"
